<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flow — минималистичная канбан-доска в браузере: приоритеты, подзадачи и локальное хранение без регистрации."
    />
    <meta property="og:title" content="Flow" />
    <meta
      property="og:description"
      content="Канбан, который не отвлекает: ясная структура, приоритеты и вложенные шаги — всё остаётся на вашем устройстве."
    />
    <meta property="og:type" content="website" />
    <!-- Если основной CSS-чанк не подгрузился (SW/кэш/редирект), страница остаётся читаемой -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1117;
        color: #e8eaee;
      }
    </style>
    <!-- PWA: manifest — public/manifest.json; иконки — /icons/icon-192.png, /icons/icon-512.png -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Flow" />
    <!-- iOS: установка на домашний экран + строка состояния в тон темы -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Flow — канбан-доска в браузере</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
