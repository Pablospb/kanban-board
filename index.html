<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Если основной CSS-чанк не подгрузился (SW/кэш/редирект), страница остаётся читаемой -->

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f1f5f9;
        color: #0f172a;
      }
    </style>
    <!-- PWA: manifest — public/manifest.json; иконки — /icons/icon-192.png, /icons/icon-512.png -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3d4248" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Мой Канбан" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Канбан" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Мой Канбан</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
